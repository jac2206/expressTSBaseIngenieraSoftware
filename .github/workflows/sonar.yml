name: SonarCloud Analysis

on:
  push:
    branches:
      - develop
      - master
  pull_request:
    branches:
      - develop
      - master

jobs:
  sonar:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v3
        with:
          node-version: 22
          cache: 'npm'

      # 👇 IMPORTANTE: usar npm ci en vez de npm install
      - run: npm ci

      # 👇 Debug temporal para verificar versiones
      - run: node -v
      - run: npm -v
      - run: npm list vitest

      - run: npm run test:coverage

      - uses: SonarSource/sonarcloud-github-action@master
        with:
          projectBaseDir: .
        env:
          SONAR_TOKEN: ${{ secrets.TOKEN_SONAR }}
